 function week(){const start=addDays(demoMonday,state.weekOffset*7);const end=addDays(start,6);const labels=['周一','周二','周三','周四','周五','周六','周日'];const cells=labels.map((label,i)=>{const date=localDate(addDays(start,i));const items=state.schedule.filter(item=>item.planned===date);return `<section class="day ${date===localDate(today)?'today':''}"><div class="dayhead"><b>${label}</b><span class="small">${dateLabel(date)}${date===localDate(today)?' · 今天':''}</span></div>${items.length?items.map(scheduleCard).join(''):'<span class="small empty-day">暂无计划</span>'}</section>`;}).join('');const unscheduled=state.schedule.filter(item=>!item.planned);return `<div class="eyebrow">WEEKLY PLAN · 演示数据</div><h1>本周安排</h1><p class="intro">按计划处理日排列；截止日只作提醒。以下均为草图虚构事项，不读取你的业务记录。</p><div class="week-tools"><div class="row">${button('上一周','week-prev','quiet')}<strong>${dateLabel(localDate(start))}—${dateLabel(localDate(end))}</strong>${button('下一周','week-next','quiet')}</div>${button('回到本周','week-today','quiet')}</div><div class="week-grid">${cells}</div><section class="unscheduled"><div class="sectionhead"><h2>未安排</h2><span class="small">无计划日；仅有截止日的事项仍留在这里</span></div>${unscheduled.length?`<div class="twocol">${unscheduled.map(item=>`<div class="day">${scheduleCard(item)}</div>`).join('')}</div>`:'<p class="empty">暂无未安排事项。可从事项详情清空计划日。</p>'}</section>${scheduleEditor()}`;}

 function trend(){const bins=trendBins();const selected=Math.min(state.trendBin,bins.length-1);const metric=state.trendMetric;const count=bin=>bin.events.filter(e=>e.type===metric).length;const max=Math.max(1,...bins.map(count));const total=bins.reduce((n,bin)=>n+count(bin),0);const detail=bins[selected];const events=detail.events.filter(e=>e.type===metric);const pageCount=Math.max(1,Math.ceil(events.length/4));const page=Math.min(state.trendPage,pageCount-1);return `<section class="trend-panel"><div class="row between"><div><h2>Agent 事件趋势</h2><p class="small">连续 24 小时区间 · 仅自定义 Agent 事项</p></div><span class="tag">${state.trendDemo?'演示事件 · 非真实记录':'空状态预览'}</span></div><div class="choice-row" aria-label="趋势时间范围">${[7,30].map(n=>`<button type="button" data-action="trend-days-${n}" aria-pressed="${state.trendDays===n}">${n} 天</button>`).join('')}</div><div class="choice-row" aria-label="事件指标">${Object.entries(trendNames).map(([id,label])=>`<button type="button" data-action="trend-metric-${id}" aria-pressed="${metric===id}">${label}</button>`).join('')}</div>${state.trendDemo?`<p class="small">${state.trendDays} 天演示合计：${total} 次${trendNames[metric]}。成功运行不等于事项完成，确认成果不代表学习效果提高。</p><div class="trend-scroll"><div class="trend-bars" style="--bars:${bins.length};min-width:${bins.length===30?810:430}px">${bins.map((bin,i)=>{const n=count(bin);return `<button type="button" class="trend-bin" data-action="trend-bin-${i}" aria-pressed="${selected===i}" data-trend-range="${trendTime(bin.start)} 至 ${trendTime(bin.end)}，${trendNames[metric]} ${n} 次" aria-label="${trendTime(bin.start)} 至 ${trendTime(bin.end)}，${trendNames[metric]} ${n} 次"><span>${n}</span><span class="bar" style="height:${Math.max(3,n/max*92)}px"></span><span class="bin-label">${bins.length===7||i%5===0||i===bins.length-1?dateLabel(localDate(new Date(bin.end))):'·'}</span></button>`;}).join('')}</div></div><p class="small" id="aw2-trend-hover" aria-live="polite">悬停或键盘聚焦区间可查看准确起止时间。</p><div class="trend-detail"><h3>${trendTime(detail.start)} 至 ${trendTime(detail.end)} · ${trendNames[metric]} ${events.length} 次</h3>${events.length?events.slice(page*4,page*4+4).map(e=>`<div class="event"><span>${esc(e.item)} · ${esc(e.agent)}</span><span class="small">${trendTime(e.time)}</span></div>`).join(''):'<p class="empty">此区间没有对应事件。</p>'}${events.length>4?`<div class="row">${button('上一页','trend-page-prev','quiet',page===0)}<span class="small">${page+1} / ${pageCount}</span>${button('下一页','trend-page-next','quiet',page>=pageCount-1)}</div>`:''}</div>`:'<p class="empty">草图没有连接业务事件，因此不能据此判断真实记录数量。正式应用在空数据时应显示零值与创建入口。</p>'}<div class="row" style="margin-top:12px">${button(state.trendDemo?'查看空状态':'查看演示趋势','trend-demo','quiet')}</div></section>`;}
 function team(){const agents=[['career','职','求职顾问','依据用户明确提供的经历准备可核对的求职材料。','事项需求、获准资料与明确上游成果'],['english','英','英语教练','依据当前事项与获准上游成果准备英文表达。','事项需求、获准资料与明确上游成果']];return `<div class="eyebrow">YOUR AGENT TEAM · 演示结构</div><h1>一起工作的团队</h1><p class="intro">正式应用保留自建 Agent 实例、预设实例、权限、偏好和详情。此草图只演示本轮新增区域。</p><section class="feature"><h2>现有近 7 天团队指标（正式应用保留）</h2><p class="small">启动运行 / 成功运行 / 失败运行 / 已确认成果及数字下钻、单 Agent 详情继续保留。草图不接业务数据，因此这里不填虚构的现有指标。</p></section>${trend()}<div class="stack">${agents.map(([id,label,name,desc,scope])=>`<article class="agent"><div class="row between"><div class="row"><span class="avatar">${label}</span><h2>${name}</h2></div><span class="tag">预设 · ${state.paused[id]?'已暂停':'可参与'} · 演示</span></div><p>${desc}</p><div class="small">可用资料由正式应用的实例权限决定；示意范围：${scope}</div><footer class="row between"><span class="small">仅切换草图状态，不改真实实例</span>${button(state.paused[id]?'恢复参与':'暂停参与','pause-'+id,'quiet')}</footer></article>`).join('')}</div><div class="feature" style="margin-top:16px"><h2>自建 Agent 实例与详情（正式应用保留）</h2><p class="small">真实实例列表、创建/编辑、启停、权限与运行详情沿用现有团队页；草图不伪造你的实例。</p></div>`;}
 function memory(){return `<div class="eyebrow">CONTEXT YOU CONTROL</div><h1>资料与记忆</h1><p class="intro">知道系统依据什么，也能纠正它记住的内容。</p><section><h2>事项资料</h2><div class="listrow"><div><h3>岗位要求与项目经历</h3><p class="small">虚构示例 · 仅用于面试准备事项</p></div>${button('查看所属事项','open','quiet')}</div><div class="listrow"><div><h3>你在项目中的角色</h3><p>${state.corrected?'已纠正：参与项目，没有主导。':'原始材料：参与知识库改版。'}</p><p class="small">${state.corrected?'来源：本事项中的明确纠正 · 中文 / 英文成果已同步':'来源：示例经历材料 · 草稿中的扩写需要核对'}</p></div></div></section><section class="section"><h2>明确偏好</h2>${state.saved?`<div class="listrow"><div><h3>英文介绍控制在一分钟，使用简洁词汇</h3><p class="small">你主动保存 · 适用于以后的英语表达任务</p></div>${button('撤销偏好','forget','quiet')}</div>`:'<p class="empty">尚未保存长期偏好。本次经历纠正仅属于对应事项。</p>'}</section><section class="section"><h2>待确认的判断</h2><p class="empty">暂无。一次作答不足以自动认定你的长期能力。</p></section>`;}
 let focusBeforeSettings=null;
 function renderTheme(){root.dataset.theme=state.mode==='neutral'?state.neutral:state.color;root.querySelector('#aw2-mode-neutral').setAttribute('aria-pressed',String(state.mode==='neutral'));root.querySelector('#aw2-mode-color').setAttribute('aria-pressed',String(state.mode==='color'));const themes=state.mode==='neutral'?[['light','浅色'],['dark','深色']]:[['blue','雾蓝'],['green','松绿'],['sand','暖棕']];root.querySelector('#aw2-themes').innerHTML=themes.map(([id,name])=>`<button type="button" aria-pressed="${root.dataset.theme===id}" data-action="theme-${id}">${name}</button>`).join('');}
 function render(){renderTheme();root.querySelector('#aw2-crumb').textContent=names[state.page];root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===(state.page==='case'?'items':state.page))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});content.innerHTML=({home,items,week,agentitems,itemdetail,team,memory,case:casePage}[state.page])();root.querySelectorAll('button,summary').forEach(b=>b.classList.add('cursor-interaction'));if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
 function openSettings(model=false){focusBeforeSettings=document.activeElement;root.querySelector('#aw2-settings').hidden=false;const target=model?root.querySelector('#aw2-model-section'):root.querySelector('.settings-dialog');target.focus();}
 function closeSettings(){root.querySelector('#aw2-settings').hidden=true;if(focusBeforeSettings?.isConnected)focusBeforeSettings.focus();}
 root.addEventListener('pointerover',e=>{const bin=e.target.closest('[data-trend-range]');if(bin)root.querySelector('#aw2-trend-hover').textContent=bin.dataset.trendRange;});
 root.addEventListener('focusin',e=>{const bin=e.target.closest('[data-trend-range]');if(bin)root.querySelector('#aw2-trend-hover').textContent=bin.dataset.trendRange;});
 root.addEventListener('input',e=>{if(e.target.id==='aw2-request')state.request=e.target.value;if(e.target.id==='aw2-note')state.note=e.target.value;});
 root.addEventListener('change',e=>{if(e.target.id==='aw2-pref'){state.saved=e.target.checked;render();notify(state.saved?'表达偏好已保存到本草图，可撤销。':'已撤销长期偏好；事项事实与成果保留。');persist();}});
 document.addEventListener('keydown',e=>{if(root.querySelector('#aw2-settings').hidden)return;if(e.key==='Escape'){e.preventDefault();closeSettings();}if(e.key==='Tab'){const dialog=root.querySelector('.settings-dialog');const controls=[...dialog.querySelectorAll('button:not([disabled])')];const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===dialog||document.activeElement===root.querySelector('#aw2-model-section'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===root.querySelector('#aw2-model-section'))){e.preventDefault();first.focus();}}});
 root.querySelector('#aw2-settings').addEventListener('click',e=>{if(e.target.id==='aw2-settings')closeSettings();});
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const action=b.dataset.action;if(action==='settings'||action==='model-settings'){openSettings(action==='model-settings');return;}if(action==='close-settings'){closeSettings();return;}if(action==='mode-neutral'||action==='mode-color'){state.mode=action.slice(5);renderTheme();persist();return;}if(action?.startsWith('theme-')){const id=action.slice(6);if(['light','dark'].includes(id)&&state.mode==='neutral')state.neutral=id;else if(['blue','green','sand'].includes(id)&&state.mode==='color')state.color=id;renderTheme();root.querySelector(`[data-action="theme-${id}"]`)?.focus();persist();return;}notify('');if(b.dataset.page){state.page=b.dataset.page;state.editing=null;render();root.querySelector('.main').scrollTop=0;persist();return;}if(!action)return;
  if(action==='start'){if(state.request.trim()!==sample){notify('草图目前仅模拟面试准备这一条完整流程，请点击“使用面试示例”。你的输入不会发送给模型。');return;}state.stage=Math.max(1,state.stage);state.page='case';}
  else if(action==='sample'){state.request=sample;state.stage=Math.max(1,state.stage);state.page='case';}
  else if(action==='open'){state.page='case';state.stage=Math.max(1,state.stage);}
  else if(action==='run'){if(blocked())return;state.stage=2;state.artifact='english';}
  else if(action==='fill'){state.note=correction;}
  else if(action==='correct'){if(blocked())return;if(state.note.trim()!==correction){notify('此草图支持预设的项目角色纠正。请点击“填入示例纠正”，再更新相关成果。');return;}state.corrected=true;state.old=false;state.note='';}
  else if(action==='version'){state.old=!state.old;}
  else if(action==='team'){state.page='team';}
  else if(action==='go-week'){state.page='week';state.editing=null;}
  else if(action==='forget'){state.saved=false;}
  else if(action.startsWith('doc-')){state.artifact=action.slice(4);}
  else if(action.startsWith('pause-')){const id=action.slice(6);if(Object.hasOwn(state.paused,id))state.paused[id]=!state.paused[id];}
  else if(action==='week-prev'){state.weekOffset--;state.editing=null;}
  else if(action==='week-next'){state.weekOffset++;state.editing=null;}
  else if(action==='week-today'){state.weekOffset=0;state.editing=null;}
  else if(action.startsWith('view-')){state.detailId=action.slice(5);state.page='itemdetail';state.editing=null;}
  else if(action.startsWith('edit-')){state.editing=action==='edit-close'?null:action.slice(5);}
  else if(action==='back-week'){state.page='week';state.editing=null;}
  else if(action==='detail-edit'){state.editing=state.detailId;}
  else if(action==='save-schedule'||action==='clear-schedule'){const item=scheduleItem(state.editing);if(!item)return;const planned=action==='clear-schedule'?'':root.querySelector('#aw2-planned').value;const due=action==='clear-schedule'?'':root.querySelector('#aw2-due').value;if((planned&&!validDate(planned))||(due&&!validDate(due))||(planned&&due&&planned>due)){notify('请输入有效日期，且计划处理日不能晚于截止日。');return;}item.planned=planned;item.due=due;state.editing=null;}
  else if(action==='trend-demo'){state.trendDemo=!state.trendDemo;state.trendPage=0;}
  else if(action.startsWith('trend-days-')){state.trendDays=Number(action.slice(11));state.trendBin=state.trendDays-1;state.trendPage=0;}
  else if(action.startsWith('trend-metric-')){state.trendMetric=action.slice(13);state.trendPage=0;}
  else if(action.startsWith('trend-bin-')){state.trendBin=Number(action.slice(10));state.trendPage=0;}
  else if(action==='trend-page-prev'){state.trendPage=Math.max(0,state.trendPage-1);}
  else if(action==='trend-page-next'){state.trendPage++;}
  render();if(action==='correct')notify('中文提纲和英文介绍均已更新为 v2，原版本已保留。');if(action==='forget')notify('已撤销长期偏好；本事项的纠正和成果保持不变。');if(action==='save-schedule'||action==='clear-schedule')notify('演示排期已更新；没有写入真实事项。');persist();});
 restore(window.openai?.widgetState);render();window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(design,'expanded',{label:'默认展开协作进展'});}
})();
</script>
